[project]
name = "migratelens"
version = "0.1.0"
description = "API Compatibility & Repair Intelligence — fictional local reference"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi==0.139.0", "uvicorn==0.51.0", "pydantic==2.13.4", "pydantic-settings==2.14.2", "SQLAlchemy==2.0.51", "alembic==1.18.5", "psycopg2-binary==2.9.12", "greenlet==3.5.3", "PyJWT==2.13.0", "cryptography==49.0.0"]
[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.15.21", "mypy==2.3.0", "pyyaml==6.0.3", "types-PyYAML==6.0.12.20260518", "build==1.5.1", "setuptools==83.0.0", "wheel==0.47.0"]

[project.scripts]
migratelens = "src.cli.main:main"
[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = false
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
