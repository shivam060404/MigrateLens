name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  ML_ENVIRONMENT: test

jobs:
  oss:
    name: standalone OSS proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without retained repository credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
      - name: pnpm
        run: npm install --global pnpm@11.11.0 --ignore-scripts
      - name: Frozen OSS install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @migratelens/oss-core
      - name: OSS build, tests and local proof
        run: make build-oss test-oss proof proof-registered
      - name: Retain fictional proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oss-fictional-proof
          path: |
            artifacts/oss-proof/
            artifacts/registered-proof/
          if-no-files-found: warn
          retention-days: 7
  baseline:
    name: baseline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout without retained repository credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.6'
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
      - name: Pinned package managers
        run: |
          python -m pip install uv==0.11.32
          npm install --global pnpm@11.11.0 --ignore-scripts
      - name: Frozen clean bootstrap
        run: make bootstrap
      - name: Python and TypeScript checks, tests and builds
        run: make check-locks check-schemas lint typecheck test-unit test-security test-typescript test-integration build
      - name: Critical repair and independent negative control
        run: make test-e2e benchmark-smoke
      - name: Compile PostgreSQL migration without database credentials
        run: make migrate-sql
      - name: Retain test evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ matrix.os }}
          path: |
            .local/test-results/*.xml
            artifacts/fictional-demo/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
